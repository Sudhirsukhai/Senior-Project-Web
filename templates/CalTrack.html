<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMR & TDEE Calculator</title>
    <link rel="stylesheet" href="/static/Caltrack.css">
</head>
<body>
    <div id="Header1">
        <h1>Calories Burnt</h1>
    </div>

    <div id="BMRCard">
        <form method="POST">
            <label for="gender">Gender:</label>
            <select name="gender" required>
                <option value="">Select...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label for="age">Age (years):</label>
            <input type="number" name="age" min="10" required>

            <label for="height">Height (cm):</label>
            <input type="number" name="height" min="100" required>

            <label for="weight">Weight (kg):</label>
            <input type="number" name="weight" min="30" required>

            <label for="activity">Activity Level:</label>
            <select name="activity" required>
                <option value="">Select...</option>
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light">Lightly active (light exercise/sports 1–3 days/week)</option>
                <option value="moderate">Moderately active (moderate exercise 3–5 days/week)</option>
                <option value="active">Very active (hard exercise 6–7 days/week)</option>
                <option value="super">Super active (very hard exercise or physical job)</option>
            </select>

            <button type="submit">Calculate</button>
        </form>

        {% if bmr %}
        <div id="result">
            <p><strong>BMR:</strong> {{ bmr }} calories/day</p>
            <p><strong>TDEE:</strong> {{ tdee }} calories/day</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
