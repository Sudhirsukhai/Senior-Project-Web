<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" 
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link rel="stylesheet" href="/static/login.css">
    </head>
    <body>
        {% with messages = get_flashed_messages(with_categories=true)%}
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger alter-dismissable fade show role"></div>
         {% endwith % }
        <div id="login">
            <h1 id="logHd">
                Register
            </h1><br>
            <form method="POST">
                <label for="Uname">Username:</label><br>
                <input type="text" id="Uname" name="Uname"><br><br>
                <label for="Pass">Password:</label><br>
                <input type="password" id="Pass" name="Pass"><br><br>
                <label for="Pass">Confirm Password:</label><br>
                <input type="password" id="ConPass" name="ConPass"><br><br>
                <button type="submit" id="Sub">Register</button><br><br>
            </form>
        </div>
    </body>
</html>
